# Iosevka build plan for the editor font: default letterforms, four styles, cut
# to the characters stylesheets use. Starting point for the Iosevka customizer.

[buildPlans.IosevkaCCSS]
family = "Iosevka"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
webfontFormats = ["WOFF2"]

# "dlig" puts the fuller ligature set on by default; "default" matches stock Iosevka
[buildPlans.IosevkaCCSS.ligations]
inherits = "dlig"

[buildPlans.IosevkaCCSS.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaCCSS.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaCCSS.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaCCSS.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

# Latin, punctuation, arrows, math, box drawing
[buildPlans.IosevkaCCSS.subset.include]
ranges = [
  [0x0020, 0x007E],
  [0x00A0, 0x017F],
  [0x0192, 0x0192],
  [0x02C6, 0x02DC],
  [0x2000, 0x206F],
  [0x20AC, 0x20AC],
  [0x2122, 0x2122],
  [0x2190, 0x21FF],
  [0x2200, 0x22FF],
  [0x2500, 0x257F],
  [0x25A0, 0x25FF],
]
