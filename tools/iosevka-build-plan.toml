# Iosevka build plan for the editor font: a customized Iosevka Term, four
# styles, cut to the characters stylesheets use. Built by tools/build-iosevka.sh.

[buildPlans.IosevkaCustom]
family = "Iosevka Custom"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
webfontFormats = ["WOFF2"]

# Fuller ligature set on by default (drop for stock Iosevka ligatures), except
# hyphen chains: they'd join every CSS custom property's leading "--"
[buildPlans.IosevkaCustom.ligations]
inherits = "dlig"
disables = ["minus-minus", "minus-minus-minus"]

[buildPlans.IosevkaCustom.variants.design]
one = "base"
two = "curly-neck-serifless"
three = "flat-top-serifless"
four = "semi-open-serifless"
five = "oblique-flat-serifless"
six = "open-contour"
seven = "bend-serifless-crossbar"
eight = "two-circles"
nine = "straight-bar"
zero = "tall-slashed"
capital-q = "crossing"
capital-z = "curly-serifless-with-horizontal-crossbar"
a = "single-storey-earless-corner-tailed"
i = "hooky"
l = "tailed-serifed"
q = "straight-motion-bottom-serifed"
z = "straight-serifless-with-horizontal-crossbar"
asterisk = "hex-low"
paren = "flat-arc"
brace = "curly-flat-boundary"
ampersand = "upper-open"
at = "compact"
dollar = "open-cap"
percent = "rings-continuous-slash"
question = "corner"
lig-ltgteq = "slanted"
lig-neq = "more-slanted"
lig-equal-chain = "without-notch"
lig-hyphen-chain = "without-notch"

[buildPlans.IosevkaCustom.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaCustom.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaCustom.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.IosevkaCustom.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaCustom.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

# Latin, punctuation, arrows, math, box drawing
[buildPlans.IosevkaCustom.subset.include]
ranges = [
  [0x0020, 0x007E],
  [0x00A0, 0x017F],
  [0x0192, 0x0192],
  [0x02C6, 0x02DC],
  [0x2000, 0x206F],
  [0x20AC, 0x20AC],
  [0x2122, 0x2122],
  [0x2190, 0x21FF],
  [0x2200, 0x22FF],
  [0x2500, 0x257F],
  [0x25A0, 0x25FF],
]
